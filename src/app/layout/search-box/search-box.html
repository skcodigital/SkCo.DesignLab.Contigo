<label class="search" role="search" [class.cerrado]="cerrado()" [class.con-texto]="consulta() !== ''" (keydown)="teclado($event)">
  <svg class="s-ico" viewBox="0 0 512 512" aria-hidden="true"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z" /></svg>
  <input #input type="search" placeholder="Elige Cliente o Caso para buscar..." aria-label="Buscar cliente o caso" aria-controls="s-drop" autocomplete="off" [value]="consulta()" (input)="escribir($event)" (focus)="cerrado.set(false)" />
  @if (consulta() !== '') {
    <button type="button" class="s-clear" aria-label="Limpiar búsqueda" (mousedown)="$event.preventDefault()" (click)="limpiar($event)">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
    </button>
  }
  <span class="s-drop" id="s-drop" (mousedown)="noRobarFoco($event)" (click)="$event.preventDefault()">
    @if (!hayConsulta()) {
      <span class="sd-bloque sd-bloque-tipos">
        <span class="sd-h">¿Qué puedes buscar?</span>
        <span class="sd-tipos">
          <span class="sd-tipo">
            <span class="sd-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg></span>
            <span class="sd-tx"><b>Cliente</b><small>Nombre, ID, Celular, Correo, Contrato</small></span>
          </span>
          <span class="sd-tipo">
            <span class="sd-ico sd-ico-caso"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M5.37905 2C8.05093 2 10.2541 3.85156 10.2541 6.125C10.2541 8.42188 8.05093 10.25 5.37905 10.25C4.93374 10.25 4.51186 10.2031 4.08999 10.1094C3.38686 10.5547 2.35561 11 1.06655 11C0.832177 11 0.62124 10.8828 0.550927 10.6484C0.457177 10.4375 0.480615 10.2031 0.644677 10.0156C0.668115 10.0156 1.18374 9.45312 1.55874 8.70312C0.90249 8 0.504052 7.10938 0.504052 6.125C0.504052 3.85156 2.68374 2 5.37905 2ZM4.3478 9.00781C4.69936 9.10156 5.02749 9.125 5.37905 9.125C7.44155 9.125 9.12905 7.78906 9.12905 6.125C9.12905 4.48438 7.44155 3.125 5.37905 3.125C3.29311 3.125 1.62905 4.48438 1.62905 6.125C1.62905 6.96875 2.02749 7.57812 2.37905 7.92969L2.94155 8.51562L2.56655 9.24219C2.4728 9.38281 2.37905 9.54688 2.2853 9.71094C2.70718 9.59375 3.10561 9.40625 3.50405 9.14844L3.90249 8.91406L4.3478 9.00781ZM10.84 5.02344C13.4416 5.11719 15.5041 6.92188 15.5041 9.125C15.5041 10.1094 15.0822 11 14.4259 11.7031C14.8009 12.4531 15.3166 13.0156 15.34 13.0156C15.5041 13.2031 15.5275 13.4375 15.4337 13.6484C15.3634 13.8828 15.1525 14 14.9181 14C13.6291 14 12.5978 13.5547 11.8947 13.1094C11.4728 13.2031 11.0509 13.25 10.6291 13.25C8.70718 13.25 7.04311 12.3125 6.24624 10.9531C6.64468 10.9062 7.04311 10.8125 7.39468 10.6719C8.05093 11.5625 9.24624 12.125 10.6291 12.125C10.9572 12.125 11.2853 12.1016 11.6369 12.0078L12.0822 11.9141L12.4806 12.1484C12.8791 12.4062 13.2775 12.5938 13.6994 12.7109C13.6056 12.5469 13.5119 12.3828 13.4181 12.2422L13.0431 11.5156L13.6056 10.9297C13.9572 10.5781 14.3791 9.96875 14.3791 9.125C14.3791 7.57812 12.8791 6.3125 10.9806 6.14844L11.0041 6.125C11.0041 5.75 10.9337 5.375 10.84 5.02344Z" fill="currentColor" /></svg></span>
            <span class="sd-tx"><b>Caso</b><small>Número de caso</small></span>
          </span>
        </span>
      </span>
    }
    <span class="sd-bloque sd-bloque-res" [class.sin-tipos]="hayConsulta()">
      <span class="sd-h" id="sd-h-res">{{ hayConsulta() ? 'Resultados' : 'Elementos recientes' }}</span>
      <span class="sd-lista" role="listbox" aria-labelledby="sd-h-res">
        @for (r of resultados(); track r.id) {
          <button #opcion type="button" class="sd-res" role="option" aria-selected="false" (click)="elegir(r, $event)">
            @if (r.tipo === Empresa) {
              <span class="sd-ico sd-ico-emp"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" /><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" /><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" /><path d="M10 6h4M10 10h4M10 14h4M10 18h4" /></svg></span>
            } @else {
              <span class="sd-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 4-6 8-6s8 2 8 6" /></svg></span>
            }
            <span class="sd-tx">
              <b>{{ r.trozos.antes }}@if (r.trozos.marca) {<mark>{{ r.trozos.marca }}</mark>}{{ r.trozos.despues }}</b>
              <small>{{ r.detalle }}</small>
            </span>
            <svg class="sd-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        } @empty {
          <span class="sd-vacio">No encontramos coincidencias. Prueba con otro nombre, ID o número de caso.</span>
        }
      </span>
    </span>
  </span>
</label>
