<div class="pv-bar" role="tablist" aria-label="Vista del prototipo" (keydown)="teclado($event)">
  <button #escritorio type="button" role="tab" [attr.aria-selected]="vista() === 'escritorio'" (click)="ver('escritorio')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></svg>Escritorio
  </button>
  <button #movil type="button" role="tab" [attr.aria-selected]="vista() === 'movil'" (click)="ver('movil')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2" /><path d="M11 18h2" /></svg>Móvil
  </button>
</div>

<div class="pv-movil" [class.show]="vista() === 'movil'">
  @if (src(); as url) {
    <div class="pv-tel">
      <iframe #telefono title="Contigo, vista móvil" [src]="url"></iframe>
    </div>
  }
</div>
