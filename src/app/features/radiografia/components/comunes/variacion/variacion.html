<b class="num">{{ texto() }}</b>
<span class="kpi-tt">
  <button type="button" class="kpi-tt-btn" [attr.aria-describedby]="idTip" [attr.aria-label]="etiqueta()">
    @switch (direccion()) {
      @case ('up') {
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9.50586 4.80664C9.50586 4.50195 9.74023 4.24414 10.0684 4.24414H14.1934C14.498 4.24414 14.7559 4.50195 14.7559 4.80664V8.93164C14.7559 9.25977 14.498 9.49414 14.1934 9.49414C13.8652 9.49414 13.6309 9.25977 13.6309 8.93164V6.16602L9.13086 10.6426C8.91992 10.877 8.56836 10.877 8.35742 10.6426L5.75586 8.04102L2.19336 11.5801C1.98242 11.8145 1.63086 11.8145 1.41992 11.5801C1.18555 11.3691 1.18555 11.0176 1.41992 10.7832L5.35742 6.8457C5.56836 6.63477 5.91992 6.63477 6.13086 6.8457L8.75586 9.4707L12.834 5.36914H10.0684C9.74023 5.36914 9.50586 5.13477 9.50586 4.80664Z" fill="currentColor"/></svg>
      }
      @case ('down') {
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10.0684 10.6221H12.834L8.75586 6.54395L6.13086 9.14551C5.91992 9.37988 5.56836 9.37988 5.35742 9.14551L1.41992 5.20801C1.18555 4.99707 1.18555 4.64551 1.41992 4.41113C1.63086 4.2002 1.98242 4.2002 2.19336 4.41113L5.75586 7.97363L8.35742 5.34863C8.56836 5.1377 8.91992 5.1377 9.13086 5.34863L13.6309 9.84863V7.05957C13.6309 6.75488 13.8652 6.49707 14.1934 6.49707C14.498 6.49707 14.7559 6.75488 14.7559 7.05957V11.1846C14.7559 11.5127 14.498 11.7471 14.1934 11.7471H10.0684C9.74023 11.7471 9.50586 11.5127 9.50586 11.1846C9.50586 10.8799 9.74023 10.6221 10.0684 10.6221Z" fill="currentColor"/></svg>
      }
      @default {
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.6 8h11.6M10 4.8 13.2 8 10 11.2" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/></svg>
      }
    }
  </button>
  <span class="kpi-tt-box" role="tooltip" [id]="idTip">{{ titulo() }}@if (detalle()) {<small>{{ detalle() }}</small>}</span>
</span>
