<div class="overlay" ncRxDialogo ncRxDialogoFoco="#descartar-ok" (cerrar)="store.cancelarDescarte()">
  <div class="modal modal--confirm" role="alertdialog" aria-modal="true" aria-labelledby="descartar-title" aria-describedby="descartar-desc">
    <button class="modal-close" aria-label="Cerrar" (click)="store.cancelarDescarte()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <span class="confirm-icon" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M26.7732 22.918C27.4607 24.1211 26.6014 25.625 25.1834 25.625H6.83573C5.41776 25.625 4.55838 24.1211 5.20291 22.918L14.3982 7.27734C14.7849 6.67578 15.3865 6.375 16.031 6.375C16.6326 6.375 17.2342 6.67578 17.6209 7.27734L26.7732 22.918ZM7.26541 23.5625H24.7537L15.9881 8.65234L7.26541 23.5625ZM16.031 19.5234C16.7615 19.5234 17.3631 20.125 17.3631 20.8555C17.3631 21.5859 16.7615 22.1875 16.031 22.1875C15.2576 22.1875 14.656 21.5859 14.656 20.8555C14.656 20.125 15.2576 19.5234 16.031 19.5234ZM14.9998 12.9062C14.9998 12.3477 15.4295 11.875 16.031 11.875C16.5896 11.875 17.0623 12.3477 17.0623 12.9062V17.0312C17.0623 17.6328 16.5896 18.0625 16.031 18.0625C15.4295 18.0625 14.9998 17.6328 14.9998 17.0312V12.9062Z" fill="currentColor"/></svg></span>
    <h2 class="confirm-title" id="descartar-title">¿Descartar esta meta?</h2>
    <div class="confirm-desc" id="descartar-desc">
      <p>Se eliminará la meta <b>{{ nombre() }}</b></p>
      <p class="confirm-meta">{{ detalle() }}</p>
      <p>Si lo deseas, puedes volver a añadirla desde <b>Editar ruta</b>, pero cambiará su fecha de inicio.</p>
    </div>
    <div class="confirm-actions">
      <button type="button" class="btn-primary" id="descartar-ok" (click)="store.confirmarDescarte()">Descartar meta</button>
      <button type="button" class="btn-outline" (click)="store.cancelarDescarte()">Cancelar</button>
    </div>
  </div>
</div>
