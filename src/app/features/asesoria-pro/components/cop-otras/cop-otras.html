<div class="cop-otras-h"><h3 class="cop-otras-tit">Otras misiones</h3></div>
@if (conRetiro()) {
  <!-- Si la misión ya se gestionó o se descartó, desde aquí se vuelve a abrir el acompañamiento -->
  <div class="cop-otras">
    <button class="jy" type="button" (click)="abrirRetiro.emit()"><span class="jy-t">Acompañamiento al retirar</span><svg ncIcono="chev" class="jy-chev"></svg></button>
  </div>
}
<p class="cop-pronto"><svg ncIcono="radar"></svg>Muy pronto traeremos para ti más herramientas de acompañamiento.</p>
