<section class="jw-etapa jw-etapa--ancha" aria-labelledby="jw-t4">
  <p class="jw-eb">Acuerdo</p>
  <h3 #titulo class="jw-h" id="jw-t4" tabindex="-1">¿Qué decidió el cliente?</h3>
  @if (destacada(); as d) {
    <div class="jw-dest jw-destacada"><b>{{ d.valor }}</b><span>{{ d.texto }}</span></div>
  }
  <div class="jw-dec" role="group" aria-labelledby="jw-t4">
    @for (o of decisiones(); track o.d) {
      <button #decBtn type="button" class="jw-op" [attr.aria-pressed]="st().dec === o.d" [disabled]="o.deshabilitada" (click)="elegir(o.d)">
        @if (o.preferida) {
          <span class="jw-tg jw-tg--menor">Preferida</span>
        }
        <b>{{ o.nombre }}</b><span>{{ o.detalle }}</span>
      </button>
    }
  </div>
  @if (conDecision()) {
    <div class="jw-a5">
      <nc-acuerdo-tramite />
      <nc-acuerdo-proximos />
      @if (st().msg; as m) {
        <p class="jw-proximo jw-a5-msg" [class.ok]="!!m.ok" aria-live="polite">{{ m.t }}</p>
      }
    </div>
  }
  <!-- Pie como el de las demás etapas: Atrás a la izquierda; enviar y registrar el cierre a la derecha (con decisión) -->
  <div class="jw-pie jw-pie--nav jw-pie5">
    <button type="button" class="jw-btn jw-btn--sec jw-ro-ok" (click)="atras()"><svg ncIcono="flecha" class="jw-atras-ico"></svg>Atrás</button>
    @if (conDecision()) {
      <div class="jw-pie5-acc">
        <button type="button" class="jw-btn jw-btn--sec jw-ro-ok" (click)="enviar()"><svg ncIcono="enviar"></svg>Enviar resumen al cliente</button>
        <button #cierre type="button" class="jw-btn" [class.jw-cerrado]="ro()" [disabled]="ro()" (click)="registrarCierre()">
          @if (ro()) {
            <svg ncIcono="ok"></svg>
          } @else {
            <svg ncIcono="clip"></svg>
          }
          {{ textoCierre() }}
        </button>
      </div>
    }
  </div>
</section>
