<label class="jw-o3 jw-o3--sel" [class.elegida]="st().pref === 'combo'">
  <span class="jw-o3-top"><input type="radio" name="jw-pref" [value]="'combo'" [checked]="st().pref === 'combo'" [disabled]="ro()" (change)="elegir()" /><h4>Retiro + Crédito Impulso</h4></span>
  <div class="jw-o3-cuerpo">
    <h5 class="jw-o3-sub">Retiro</h5>
    <!-- Misma narrativa que la caja Retiro: Recibe + Descuentos de hoy = Valor total del retiro -->
    <dl>
      <div class="jw-o3-recibe jw-o3-recibe--sub"><dt>Recibe del retiro</dt><dd>{{ pesos(cb().kt.R) }}</dd></div>
      <!-- Desglose plegable, igual que en la caja Retiro -->
      <div class="jw-o3-desc">
        <dt>
          <button type="button" class="jw-o3-desp jw-ro-ok" [class.abierto]="verDesc()" [attr.aria-expanded]="verDesc()" aria-controls="jw-desc-combo" (click)="alternarDesc($event)">
            + Descuentos de hoy<svg ncIcono="chev"></svg>
          </button>
        </dt>
        <dd>{{ pesos(cb().kt.D - cb().kt.R) }}</dd>
      </div>
      @if (verDesc()) {
        <div class="jw-o3-det" id="jw-desc-combo"><dt>Retención contingente</dt><dd>{{ pesos(cb().kt.rcA) }}</dd></div>
        <div class="jw-o3-det"><dt>Retención sobre rendimientos</dt><dd>{{ pesos(cb().kt.rrA) }}</dd></div>
        <div class="jw-o3-det"><dt>4×1000</dt><dd>{{ pesos(cb().kt.g) }}</dd></div>
      }
      <div class="tot tot--sub"><dt>= Valor total del retiro</dt><dd>{{ pesos(cb().kt.D) }}</dd></div>
    </dl>
    <h5 class="jw-o3-sub">Crédito por lo que falta</h5>
    <dl>
      <div><dt>Monto</dt><dd>{{ pesos(cb().M) }}</dd></div>
    </dl>
    <nc-plazo-credito />
    <dl>
      <div><dt>Tasa</dt><dd>{{ tasa }}</dd></div>
      <div><dt>Intereses y 4×1000</dt><dd>{{ pesos(cb().cr.costo) }}</dd></div>
      <div class="tot verde"><dt>Recibe</dt><dd>{{ pesos(cb().recibe) }}</dd></div>
    </dl>
    <dl>
      <div>
        <dt>
          Costo de la combinación<small class="jw-imp-nota"
            >intereses más posible impuesto
            <button type="button" class="jw-dian jw-ro-ok" aria-label="Impuesto de la DIAN: Skandia no lo cobra" title="Este impuesto lo liquida el cliente en su declaración de renta y lo paga a la DIAN. Skandia no lo cobra.">DIAN</button
            >{{ imp().nota }} · <button type="button" class="jw-link jw-ro-ok" (click)="ajustar()">Ajustar</button></small
          >
        </dt>
        <dd>{{ costo() }}</dd>
      </div>
    </dl>
    @if (!cb().cubre) {
      <p class="jw-o3-nota">El crédito disponible ({{ pesos(cb().disp) }}) no cubre lo que falta ({{ pesos(cb().falta) }}).</p>
    }
  </div>
</label>
