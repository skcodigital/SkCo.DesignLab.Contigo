<div class="tabs" role="tablist">
  @for (p of pestanas; track p.id) {
    <div
      class="tab"
      role="tab"
      tabindex="0"
      [class.on]="p.id === activa()"
      [attr.aria-selected]="p.id === activa()"
      [attr.data-panel]="p.id"
      (click)="elegir.emit(p.id)"
      (keydown)="alTeclado($event, p.id)"
    >
      @switch (p.id) {
        @case ('copiloto') {
          <img class="tab-sami" src="assets/sami.png" alt="" width="30" height="30" />
        }
        @case ('productos') {
          <svg class="ico" viewBox="0 0 24 24"><rect class="f" x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7V5h8v2" /><path class="d" d="M3 13h18M11 13v2h2v-2" /></svg>
        }
        @case ('datos') {
          <svg class="ico" viewBox="0 0 24 24"><circle class="f" cx="12" cy="8" r="4" /><path class="f" d="M4 21c0-4 4-6 8-6s8 2 8 6z" /></svg>
        }
        @case ('documentos') {
          <svg class="ico" viewBox="0 0 24 24"><path class="f" d="M6 3h8l4 4v14H6z" /><path class="d" d="M14 3v4h4" /></svg>
        }
        @case ('casos') {
          <svg class="ico" viewBox="0 0 24 24"><rect class="f" x="4" y="3" width="16" height="10" rx="1" /><path class="f" d="M3 12l9 6 9-6v9H3z" /><path class="d" d="M8 7h8" /></svg>
        }
        @case ('recomendacion') {
          <svg class="ico" viewBox="0 0 24 24"><path class="f" d="M9 3h6l1 2h3v16H5V5h3z" /><path class="d" d="M9 3v3h6V3" /><path class="d" d="M9 13l2 2 4-4" /></svg>
        }
        @case ('actividades') {
          <svg class="ico" viewBox="0 0 24 24"><rect class="f" x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4" /><path class="d" d="M3 10h18" /><path class="d" d="M8 15l2 2 4-4" /></svg>
        }
      }
      @if (p.titulo) {
        <span [title]="p.titulo">{{ p.etiqueta }}</span>
      } @else {
        {{ p.etiqueta }}
      }
      <svg class="m-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
    </div>
  }
</div>
