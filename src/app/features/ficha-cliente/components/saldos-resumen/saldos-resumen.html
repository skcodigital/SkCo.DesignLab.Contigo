<section class="saldos">
  <div class="saldos-h">
    <h2>
      <span class="tt">Total bajo gestión:</span>
      <span class="amt">{{ saldos().total | monto: oculto() }}</span>
      <button class="ojo" type="button" [attr.aria-label]="etiquetaOjo()" [attr.aria-pressed]="oculto()" (click)="alternarOjo.emit()">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @if (oculto()) {
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
            <circle cx="12" cy="12" r="3" />
          } @else {
            <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49" />
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242" />
            <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143" />
            <path d="m2 2 20 20" />
          }
        </svg>
      </button>
      <span class="tip">
        <button class="tip-btn" type="button" aria-label="¿Qué es Total bajo gestión?" aria-describedby="tip-total">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path fill="#0099DE" d="M16 5C22.0586 5 27 9.94141 27 16C27 22.1016 22.0586 27 16 27C9.89844 27 5 22.1016 5 16C5 9.94141 9.89844 5 16 5ZM16 24.9375C20.8984 24.9375 24.9375 20.9414 24.9375 16C24.9375 11.1016 20.8984 7.0625 16 7.0625C11.0586 7.0625 7.0625 11.1016 7.0625 16C7.0625 20.9414 11.0586 24.9375 16 24.9375ZM16 19.4375C16.7305 19.4375 17.375 20.0391 17.375 20.8125C17.375 21.5859 16.7305 22.1875 16 22.1875C15.1836 22.1875 14.625 21.5859 14.625 20.8125C14.625 20.0391 15.2266 19.4375 16 19.4375ZM17.418 10.5C19.1367 10.5 20.4688 11.832 20.4258 13.5078C20.4258 14.5391 19.8672 15.5273 18.9648 16.0859L17.0312 17.2891V17.375C17.0312 17.9336 16.5586 18.4062 16 18.4062C15.4414 18.4062 14.9688 17.9336 14.9688 17.375V16.6875C14.9688 16.3438 15.1406 16 15.4844 15.7852L17.9336 14.3242C18.2344 14.1523 18.4062 13.8516 18.4062 13.5078C18.4062 12.9922 17.9336 12.5625 17.375 12.5625H15.1836C14.668 12.5625 14.2812 12.9922 14.2812 13.5078C14.2812 14.0664 13.8086 14.5391 13.25 14.5391C12.6914 14.5391 12.2188 14.0664 12.2188 13.5078C12.2188 11.832 13.5508 10.5 15.2266 10.5H17.418Z" /></svg>
        </button>
        <span class="tip-box" role="tooltip" id="tip-total">{{ saldos().tooltip }}</span>
      </span>
    </h2>
    <button type="button" class="saldos-tgl" aria-controls="kpis-saldos" [attr.aria-expanded]="!recogidos()" (click)="alternarRecogidos.emit()">
      <span>{{ textoRecoger() }}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
    </button>
  </div>
  <button class="m-ampliar" type="button" [attr.aria-expanded]="ampliado()" (click)="alternarAmpliado.emit()">
    {{ textoAmpliar() }}
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 8v8M8 12h8" /></svg>
  </button>
  <div class="kpis" id="kpis-saldos">
    @for (kpi of saldos().kpis; track kpi.icono) {
      <nc-kpi-card [kpi]="kpi" [oculto]="oculto()" [ampliado]="ampliado()" />
    }
  </div>
</section>
