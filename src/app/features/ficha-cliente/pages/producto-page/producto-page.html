@let producto = ficha.producto();
<section class="v-producto" [attr.aria-label]="etiqueta()" [attr.data-producto]="producto.tipo">
  <nc-producto-movil [producto]="producto" />
  <nc-producto-tarjetas [producto]="producto" />
  <nc-producto-tabs
    [pestanas]="ficha.pestanasProducto()"
    [activa]="ficha.pestanaProducto()"
    [novedad]="novedades.saldosOtrasFechas()"
    (elegir)="abrirSeccion($event)"
    (cerrarNovedad)="novedades.apagarSaldosOtrasFechas()"
    (irANovedad)="irANovedad()"
  />

  @switch (ficha.panelProducto()) {
    @case ('composicion') {
      <div class="pf-panel" data-pf-panel="composicion">
        <div class="pf-caja">
          <nc-producto-composicion
            [vista]="store.vista()"
            [hoy]="store.hoy"
            [minima]="store.minima"
            (elegirSegmento)="store.elegirSegmento($event)"
            (elegirFechaCorte)="store.elegirFechaCorte($event)"
            (elegirEstado)="store.elegirEstado($event)"
            (usarNovedad)="novedades.apagarSaldosOtrasFechas()"
          />
        </div>
      </div>
    }
    @case ('movimientos') {
      <div class="pf-panel" data-pf-panel="movimientos">
        <div class="pf-caja"><nc-producto-movimientos [movimientos]="movimientos" /></div>
      </div>
    }
    @default {
      <div class="pf-panel" data-pf-panel="otros">
        <div class="pf-caja pf-vacio"><p>Contenido de esta sección en construcción.</p></div>
      </div>
    }
  }
</section>
